name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stashly-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stashly-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint when configured
        run: npm run lint --if-present

      - name: Run tests when configured
        run: npm run test --if-present

      - name: Type-check and build web app
        run: npm run build

  broker:
    name: Broker checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stashly-broker
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/stashly?schema=public"
      JWT_SECRET: "ci-dummy-jwt-secret-for-build-and-lint"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stashly-broker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run lint when configured
        run: npm run lint --if-present

      - name: Run tests when configured
        run: npm run test --if-present

      - name: Type-check and build broker
        run: npm run build

  android:
    name: Android checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stashly-android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Android lint, tests, and debug build
        run: ./gradlew --no-daemon --stacktrace lint test assembleDebug
